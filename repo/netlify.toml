# Field Survey Dashboard – Netlify configuration
[build]
  publish = "dist"

# Access control lives in netlify/edge-functions/auth.ts. That file declares its own route
# (path "/*", onError "fail"), so every request passes the Entra ID check before anything is
# served, and a crash in the function returns an error page instead of bypassing the check.

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
